<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <!-- Network dots and lines (decorative) -->
  <g opacity="0.18" stroke="white" stroke-width="2" fill="white">
    <line x1="80" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="420" y2="140"/>
    <line x1="420" y1="140" x2="380" y2="320"/>
    <line x1="80" y1="120" x2="140" y2="380"/>
    <line x1="140" y1="380" x2="380" y2="320"/>
    <line x1="200" y1="80" x2="140" y2="380"/>
    <circle cx="80" cy="120" r="8"/>
    <circle cx="200" cy="80" r="6"/>
    <circle cx="420" cy="140" r="8"/>
    <circle cx="380" cy="320" r="6"/>
    <circle cx="140" cy="380" r="8"/>
  </g>
  <!-- Letters SP -->
  <text x="256" y="320" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="220" text-anchor="middle" fill="white" letter-spacing="-8">SP</text>
</svg>
